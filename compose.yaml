# Sobe PostgreSQL + aplicação Spring Boot:  docker compose up --build
# Acesse http://localhost:8080 (usuário admin / senha admin123, ou ADMIN_PASSWORD).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estoque
      POSTGRES_USER: estoque
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-estoque}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estoque -d estoque"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/estoque
      DB_USERNAME: estoque
      DB_PASSWORD: ${POSTGRES_PASSWORD:-estoque}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      DEMO_DATA: ${DEMO_DATA:-true}
    ports:
      - "8080:8080"

volumes:
  pgdata:
