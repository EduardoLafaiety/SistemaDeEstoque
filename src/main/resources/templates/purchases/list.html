<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Compras', content=~{::main})}">
<body>
<main class="o-main">
    <div class="o-control-panel">
        <div class="o-cp-left">
            <a class="btn btn-primary btn-sm" th:href="@{/purchases/new}">Novo</a>
            <span class="o-cp-title">Solicitações de cotação e pedidos</span>
        </div>
        <div class="o-cp-center">
            <div th:replace="~{fragments :: search('Buscar referência, fornecedor ou origem...')}"></div>
        </div>
        <div class="o-cp-right">
            <div th:replace="~{fragments :: pager(${page})}"></div>
        </div>
    </div>
    <div class="o-with-panel">
        <aside class="o-search-panel">
            <h6><i class="bi bi-folder-fill"></i> Status</h6>
            <ul>
                <li><a th:href="@{/purchases}" th:classappend="${state == null} ? 'active'">Todos</a></li>
                <li th:each="s : ${states}"><a th:href="@{/purchases(state=${s})}" th:classappend="${state == s} ? 'active'" th:text="${s.label}"></a></li>
            </ul>
        </aside>
        <div class="o-content">
            <table class="o-list" th:if="${page.hasContent()}">
                <thead><tr><th>Referência</th><th>Fornecedor</th><th>Data do pedido</th><th>Entrega prevista</th><th>Origem</th><th class="num">Total</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="o : ${page.content}" th:attr="data-href=@{/purchases/{id}(id=${o.id})}">
                    <td class="fw-semibold" th:text="${o.reference}"></td>
                    <td th:text="${o.partner.name}"></td>
                    <td th:text="${@fmt.date(o.orderDate)}"></td>
                    <td th:text="${@fmt.date(o.expectedDate)}"></td>
                    <td class="muted" th:text="${o.origin}"></td>
                    <td class="num" th:text="${@fmt.money(o.total)}"></td>
                    <td><span class="badge-state" th:classappend="|badge-${o.state}|" th:text="${o.state.label}"></span></td>
                </tr>
                </tbody>
            </table>
            <div class="o-empty" th:unless="${page.hasContent()}">
                <i class="bi bi-cart"></i>
                <p>Nenhum pedido de compra.</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
