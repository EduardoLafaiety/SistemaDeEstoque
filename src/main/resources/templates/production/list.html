<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Ordens de produção', content=~{::main})}">
<body>
<main class="o-main">
    <div class="o-control-panel">
        <div class="o-cp-left">
            <a class="btn btn-primary btn-sm" th:href="@{/production/new}">Novo</a>
            <span class="o-cp-title">Ordens de produção</span>
        </div>
        <div class="o-cp-center">
            <div th:replace="~{fragments :: search('Buscar referência ou produto...')}"></div>
        </div>
        <div class="o-cp-right">
            <div th:replace="~{fragments :: pager(${page})}"></div>
        </div>
    </div>
    <div class="o-with-panel">
        <aside class="o-search-panel">
            <h6><i class="bi bi-folder-fill"></i> Status</h6>
            <ul>
                <li><a th:href="@{/production}" th:classappend="${state == null} ? 'active'">Todas</a></li>
                <li th:each="s : ${states}"><a th:href="@{/production(state=${s})}" th:classappend="${state == s} ? 'active'" th:text="${s.label}"></a></li>
            </ul>
        </aside>
        <div class="o-content">
            <table class="o-list" th:if="${page.hasContent()}">
                <thead><tr><th>Referência</th><th>Produto</th><th>Destino</th><th>Data programada</th><th>Origem</th><th class="num">Quantidade</th><th>Status</th></tr></thead>
                <tbody>
                <tr th:each="o : ${page.content}" th:attr="data-href=@{/production/{id}(id=${o.id})}">
                    <td class="fw-semibold" th:text="${o.reference}"></td>
                    <td th:text="${o.product.displayName}"></td>
                    <td class="muted" th:text="${o.location.fullName}"></td>
                    <td th:text="${@fmt.date(o.scheduledDate)}"></td>
                    <td class="muted" th:text="${o.origin}"></td>
                    <td class="num" th:text="${@fmt.qty(o.quantity)}"></td>
                    <td><span class="badge-state" th:classappend="|badge-${o.state}|" th:text="${o.state.label}"></span></td>
                </tr>
                </tbody>
            </table>
            <div class="o-empty" th:unless="${page.hasContent()}">
                <i class="bi bi-gear-wide-connected"></i>
                <p>Nenhuma ordem de produção.</p>
            </div>
        </div>
    </div>
</main>
</body>
</html>
