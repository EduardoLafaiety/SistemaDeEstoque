<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar · Estoque</title>
    <link rel="icon" th:href="@{/img/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="o-login">
    <form class="o-login-card" method="post" th:action="@{/login}">
        <div class="text-center mb-4">
            <span class="o-logo" style="width:48px;height:48px;font-size:1.5rem;border-radius:10px"><i class="bi bi-box-seam"></i></span>
            <h1 class="h5 mt-3 mb-0">Sistema de Estoque</h1>
            <small class="text-muted">Entre com seu usuário</small>
        </div>
        <div class="alert alert-danger py-2" th:if="${param.error}">Usuário ou senha inválidos.</div>
        <div class="alert alert-success py-2" th:if="${param.logout}">Você saiu do sistema.</div>
        <div class="mb-3">
            <label class="form-label" for="username">Usuário</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Senha</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Entrar</button>
    </form>
</div>
</body>
</html>
