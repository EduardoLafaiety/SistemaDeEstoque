<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title=${form.id == null ? 'Novo produto' : form.name}, content=~{::main})}">
<body>
<main class="o-main">
    <div class="o-control-panel">
        <div class="o-cp-left">
            <span class="o-cp-title"><a class="bc" th:href="@{/products}">Produtos</a> /
                <span th:text="${form.id == null} ? 'Novo' : ${form.name}"></span></span>
        </div>
        <div></div>
        <div class="o-cp-right">
            <button class="btn btn-primary btn-sm" type="submit" form="productForm">Salvar</button>
            <a class="btn btn-secondary btn-sm" th:href="@{/products}">Descartar</a>
        </div>
    </div>
    <div class="o-form-view">
        <div class="o-form-statusbar" th:if="${form.id != null}">
            <div class="d-flex gap-2 flex-wrap">
                <a class="btn btn-secondary btn-sm" th:href="@{/pickings/new(type='RECEIPT')}">Receber</a>
                <a class="btn btn-secondary btn-sm" th:href="@{/inventory}">Atualizar quantidade</a>
                <a class="btn btn-secondary btn-sm" th:href="@{/replenishment/new}">Criar regra de reposição</a>
                <form method="post" th:action="@{/products/{id}/archive(id=${form.id})}" class="d-inline">
                    <input type="hidden" name="active" th:value="${!form.active}">
                    <button class="btn btn-secondary btn-sm" type="submit"
                            th:text="${form.active} ? 'Arquivar' : 'Restaurar'"
                            th:attr="data-confirm=${form.active} ? 'Arquivar este produto?' : null"></button>
                </form>
            </div>
            <div class="d-flex gap-2">
                <a class="o-stat" th:href="@{/reports/stock(q=${form.sku != null ? form.sku : form.name})}">
                    <i class="bi bi-boxes"></i><span><strong th:text="${@fmt.qty(onHand)} + ' ' + ${form.uom}"></strong><small>Em estoque</small></span></a>
                <a class="o-stat" th:href="@{/products/{id}/forecast(id=${form.id})}">
                    <i class="bi bi-bar-chart-line"></i><span><strong>Previsão</strong><small>Entradas e saídas</small></span></a>
            </div>
        </div>

        <form id="productForm" class="o-form-sheet" method="post" th:action="@{/products/save}" th:object="${form}">
            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{active}">
            <div class="alert alert-warning py-2" th:if="${form.id != null and !form.active}">Este produto está arquivado.</div>
            <div class="alert alert-danger" th:if="${#fields.hasAnyErrors()}">
                <div th:each="e : ${#fields.allErrors()}" th:text="${e}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="name">Nome do produto</label>
                <input class="form-control form-control-lg" th:field="*{name}" placeholder="ex.: Cadeira de escritório" required>
            </div>

            <ul class="nav nav-tabs mb-3" role="tablist">
                <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-general" type="button">Informações gerais</button></li>
                <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-inventory" type="button">Estoque</button></li>
                <li class="nav-item" th:if="${form.id != null}"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-moves" type="button">Movimentos</button></li>
            </ul>

            <div class="tab-content">
                <div class="tab-pane fade show active" id="tab-general">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label" for="sku">Código interno (SKU)</label>
                            <input class="form-control" th:field="*{sku}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="barcode">Código de barras</label>
                            <input class="form-control" th:field="*{barcode}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="categoryId">Categoria</label>
                            <select class="form-select" th:field="*{categoryId}">
                                <option value="">—</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="cost">Custo (R$)</label>
                            <input class="form-control" type="number" step="0.01" min="0" th:field="*{cost}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="salePrice">Preço de venda (R$)</label>
                            <input class="form-control" type="number" step="0.01" min="0" th:field="*{salePrice}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="uom">Unidade de medida</label>
                            <input class="form-control" th:field="*{uom}" list="uoms" required>
                            <datalist id="uoms"><option>Un</option><option>Cx</option><option>Kg</option><option>L</option><option>m</option><option>Pç</option></datalist>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="description">Descrição</label>
                            <textarea class="form-control" rows="3" th:field="*{description}"></textarea>
                        </div>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab-inventory">
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="route">Rota de reposição</label>
                            <select class="form-select" th:field="*{route}">
                                <option th:each="r : ${routes}" th:value="${r}" th:text="${r.label}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="supplierId">Fornecedor padrão</label>
                            <select class="form-select" th:field="*{supplierId}">
                                <option value="">—</option>
                                <option th:each="s : ${suppliers}" th:value="${s.id}" th:text="${s.name}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="leadTimeDays">Prazo de entrega/produção (dias)</label>
                            <input class="form-control" type="number" min="0" th:field="*{leadTimeDays}">
                        </div>
                    </div>
                    <div th:if="${form.id != null}">
                        <h6 class="mt-3">Saldo por local</h6>
                        <table class="o-list mb-3">
                            <thead><tr><th>Local</th><th class="num">Quantidade</th></tr></thead>
                            <tbody>
                            <tr th:each="q : ${quants}"><td th:text="${q.location.fullName}"></td><td class="num" th:text="${@fmt.qty(q.quantity)}"></td></tr>
                            <tr th:if="${quants.isEmpty()}"><td colspan="2" class="muted">Sem saldo.</td></tr>
                            </tbody>
                        </table>
                        <h6>Regras de reposição</h6>
                        <table class="o-list">
                            <thead><tr><th>Local</th><th>Gatilho</th><th class="num">Mín.</th><th class="num">Máx.</th></tr></thead>
                            <tbody>
                            <tr th:each="r : ${rules}" th:attr="data-href=@{/replenishment/{id}(id=${r.id})}">
                                <td th:text="${r.location.fullName}"></td><td th:text="${r.trigger.label}"></td>
                                <td class="num" th:text="${@fmt.qty(r.minQty)}"></td><td class="num" th:text="${@fmt.qty(r.maxQty)}"></td>
                            </tr>
                            <tr th:if="${rules.isEmpty()}"><td colspan="4" class="muted">Nenhuma regra.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade" id="tab-moves" th:if="${form.id != null}">
                    <table class="o-list">
                        <thead><tr><th>Data</th><th>Referência</th><th>De</th><th>Para</th><th class="num">Quantidade</th></tr></thead>
                        <tbody>
                        <tr th:each="m : ${moves}">
                            <td th:text="${@fmt.dateTime(m.date)}"></td><td th:text="${m.reference}"></td>
                            <td class="muted" th:text="${m.sourceLocation.fullName}"></td><td class="muted" th:text="${m.destLocation.fullName}"></td>
                            <td class="num" th:text="${@fmt.qty(m.quantity)}"></td>
                        </tr>
                        <tr th:if="${moves.isEmpty()}"><td colspan="5" class="muted">Nenhum movimento.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </form>
    </div>
</main>
</body>
</html>
