<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Erro · Estoque</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="o-login">
    <div class="o-login-card text-center">
        <i class="bi bi-exclamation-octagon fs-1" style="color: var(--o-primary)"></i>
        <h1 class="h4 mt-2" th:text="${status == 404} ? 'Página não encontrada' : (${status == 403} ? 'Acesso negado' : 'Algo deu errado')">Erro</h1>
        <p class="text-muted" th:text="${status == 403} ? 'Você não tem permissão para acessar esta página.' : 'Código ' + ${status}"></p>
        <a class="btn btn-primary" th:href="@{/}">Voltar ao início</a>
    </div>
</div>
</body>
</html>
