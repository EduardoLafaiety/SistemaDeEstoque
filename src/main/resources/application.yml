spring:
  application:
    name: sistema-estoque
  # Variáveis locais (DB_PASSWORD etc.) podem ficar em um arquivo .env na raiz do projeto.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/estoque}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  data:
    web:
      pageable:
        serialization-mode: via-dto
  mvc:
    format:
      date: iso
      date-time: iso

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 8h

app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
  demo-data: ${DEMO_DATA:true}
  replenishment:
    cron: "0 */15 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.estoque: info
